services:
  db:
    image: postgres:15-alpine
    container_name: decoupled-db-tesis
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5438:5432"
    volumes:
      - pgdata-tesis:/var/lib/postgresql/data
    networks:
      - app-network-tesis

  backend:
    build: .
    container_name: decoupled-backend-tesis
    restart: always
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mydb
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
    networks:
      - app-network-tesis

volumes:
  pgdata-tesis:

networks:
  app-network-tesis:
    driver: bridge